{% extends 'base.html' %}

{% block title %}Hasło zmienione | StyleMuse{% endblock %}

{% block content %}
<div class="min-h-screen bg-[#faf9f6] flex items-center justify-center px-4">
    <div class="w-full max-w-md">

        <div class="text-center mb-10">
            <a href="{% url 'home' %}" class="font-serif text-3xl tracking-widest font-semibold">
                STYLE<span class="text-[#c8a97e]">MUSE</span>
            </a>
        </div>

        <div class="bg-white rounded-sm border border-[#eeeeee] shadow-sm p-10 text-center">

            <div class="flex justify-center mb-6">
                <div class="w-14 h-14 bg-[#faf9f6] rounded-full flex items-center justify-center border border-[#c8a97e]/30">
                    <i data-lucide="check-circle" class="w-6 h-6 text-[#c8a97e]"></i>
                </div>
            </div>

            <h1 class="font-serif text-3xl text-[#1c1917] mb-3">Gotowe!</h1>
            <p class="text-sm text-gray-400 font-light leading-relaxed mb-8">
                Twoje hasło zostało pomyślnie zmienione.<br/>
                Możesz teraz zalogować się używając nowego hasła.
            </p>

            <a href="{% url 'login' %}"
               class="block w-full py-4 bg-[#1c1917] text-white text-[10px] font-bold uppercase tracking-[0.3em]
                      hover:bg-black transition-all rounded-sm shadow-sm">
                Zaloguj się
            </a>
        </div>

    </div>
</div>
{% endblock %}
